<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pronosticuri Lite – Auto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{background:#0b1220;color:#e5edff;font-family:ui-sans-serif,system-ui,Inter,Segoe UI,Roboto}
    .card{background:#111a2e;border:1px solid rgba(255,255,255,.08);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
    .input{background:#0f1730;border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:10px 12px;width:100%}
    .btn{border-radius:12px;padding:10px 14px;font-weight:600}
    .btn-primary{background:#4f7cff;color:#fff}
    .hint{color:#8aa0bf}
    .badge{border-radius:999px;padding:3px 8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:12px}
  </style>
</head>
<body class="min-h-screen">
  <header class="max-w-3xl mx-auto px-4 py-6 flex items-center gap-3">
    <div class="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center">⚽</div>
    <div>
      <h1 class="text-xl font-bold">Pronosticuri Lite – Auto</h1>
      <p class="hint text-sm">Introduci meciul ➜ **Evaluează** ➜ primești pronosticul. Fără setări, fără chei API în UI.</p>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pb-16">
    <section class="card p-5">
      <label class="block text-sm mb-1">Meci</label>
      <input id="matchInput" class="input mb-3" placeholder="Ex: FCSB vs CFR Cluj" />
      <button id="btnEvaluate" class="btn btn-primary w-full">Evaluează</button>
      <div id="status" class="hint mt-3"></div>
    </section>

    <section id="results" class="card p-5 mt-5 hidden">
      <div id="matchMeta" class="mb-3 text-sm"></div>
      <div id="factors" class="mb-3 text-sm"></div>
      <div id="tableWrap" class="overflow-x-auto"></div>
      <div class="mt-3 text-xs hint">Atenție: pronosticul este experimental și nu garantează profit.</div>
    </section>
  </main>

  <script>
    const qs = (s,el=document)=>el.querySelector(s);
    const qsa=(s,el=document)=>Array.from(el.querySelectorAll(s));

    async function evaluateMatchClient(query){
      const status=qs('#status'); const results=qs('#results'); const tableWrap=qs('#tableWrap'); const meta=qs('#matchMeta'); const facts=qs('#factors');
      results.classList.add('hidden'); status.textContent=''; tableWrap.innerHTML=''; meta.innerHTML=''; facts.innerHTML='';
      if(!query){ status.textContent='Scrie "Echipă A vs Echipă B".'; return; }
      try{
        status.textContent='Caut și calculez…';
        const res = await fetch('/api/evaluate?match='+encodeURIComponent(query));
        if(!res.ok) throw new Error('Serverul a răspuns cu '+res.status);
        const data = await res.json();

        const m = data.match||{}; const w = (data.weather||{}); const inj = data.injuries||{}; const ages = data.ages||{}; const form = data.form||{};
        const when = m.dateISO? new Date(m.dateISO).toLocaleString() : 'data necunoscută';
        meta.innerHTML = `Meci: <strong>${m.homeName||'?'} vs ${m.awayName||'?'}</strong> • ${m.leagueName||'Liga necunoscută'} • ${when}${m.venue? ' • '+m.venue : ''}`;

        const parts = [];
        if(w && w.summary){ parts.push(`Vreme: ${w.summary}`); }
        if(inj && (inj.home!=null || inj.away!=null)){ parts.push(`Accidentări: ${inj.home||0}–${inj.away||0}`); }
        if(ages && (ages.home||ages.away)){ parts.push(`Vârsta medie: ${ages.home? ages.home.toFixed(1):'–'} vs ${ages.away? ages.away.toFixed(1):'–'}`); }
        if(form && (form.home||form.away)){ parts.push(`Formă (marcate/primite): ${form.home? form.home.scored.toFixed(2)+'/'+form.home.conceded.toFixed(2):'–'} vs ${form.away? form.away.scored.toFixed(2)+'/'+form.away.conceded.toFixed(2):'–'}`); }
        facts.innerHTML = parts.length? parts.join(' • ') : '';

        const picks = data.picks||[];
        let html = '<table class="w-full text-sm"><thead><tr><th class="text-left py-2">Piață</th><th class="text-left py-2">Selecție</th><th class="text-left py-2">Prob.</th><th class="text-left py-2">Cota</th><th class="text-left py-2">Bookie</th><th class="text-left py-2">EV/unit</th></tr></thead><tbody>';
        for(const pk of picks){
          const evTxt = pk.ev!=null? ((pk.ev>=0?'+':'')+pk.ev.toFixed(3)) : '—';
          const oddTxt= pk.odds? pk.odds.toFixed(2) : '—';
          const prob  = pk.p!=null? (pk.p*100).toFixed(1)+'%' : '—';
          html += `<tr class="border-t border-white/10"><td class="py-2">${pk.market}</td><td class="py-2">${pk.selection}</td><td class="py-2">${prob}</td><td class="py-2">${oddTxt}</td><td class="py-2">${pk.bookie||'—'}</td><td class="py-2">${evTxt}</td></tr>`;
        }
        html += '</tbody></table>';
        tableWrap.innerHTML = html;
        results.classList.remove('hidden');
        status.textContent = data.note || 'Gata.';
      }catch(e){
        status.textContent = 'Eroare: '+e.message+ ' — verifică dacă serverul /api/evaluate este pornit.';
      }
    }

    qs('#btnEvaluate').addEventListener('click',()=>evaluateMatchClient(qs('#matchInput').value.trim()));
    qs('#matchInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); qs('#btnEvaluate').click(); } });
  </script>
</body>
</html>
